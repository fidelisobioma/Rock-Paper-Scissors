<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="score_board">
          <div class="rpsls_header">
            <img
              src="images/logo-bonus.svg"
              alt="rock, paper, scissors, lizard, spock"
            />
          </div>
          <div class="score">
            <p class="score_text">score</p>
            <p class="score_num">12</p>
          </div>
        </div>
      </header>
      <div class="rpsls">
        <div class="pentagon">
          <div class="scissors">
            <div>
              <img src="images/icon-scissors.svg" alt="scissors" />
            </div>
          </div>
          <div class="paper">
            <div>
              <img src="images/icon-paper.svg" alt="paper" />
            </div>
          </div>
          <div class="rock">
            <div>
              <img src="images/icon-rock.svg" alt="paper" />
            </div>
          </div>
          <div class="lizard">
            <div>
              <img src="images/icon-lizard.svg" alt="lizard" />
            </div>
          </div>
          <div class="spock">
            <div>
              <img src="images/icon-spock.svg" alt="spock" />
            </div>
          </div>
          <img src="images/bg-pentagon.svg" alt="pentagon" />
        </div>
      </div>
      <div class="rules"><button>RULES</button></div>
    </div>
  </body>
</html>
