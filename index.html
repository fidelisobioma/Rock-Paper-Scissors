<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="score_board">
          <div class="rpsls_header">
            <img
              src="images/logo-bonus.svg"
              alt="rock, paper, scissors, lizard, spock"
            />
          </div>
          <div class="scores">
            <div class="score">
              <p class="score_text">YOU...</p>
              <p class="score_num you">0</p>
            </div>
            <div class="score">
              <p class="score_text">COM...</p>
              <p class="score_num com">0</p>
            </div>
          </div>
        </div>
      </header>
      <div class="rpsls">
        <div class="pentagon">
          <div class="RPSLS">
            <div id="scissors">
              <div>
                <img id="img" src="images/icon-scissors.svg" alt="scissors" />
              </div>
            </div>
            <div id="paper">
              <div>
                <img id="img" src="images/icon-paper.svg" alt="paper" />
              </div>
            </div>
            <div id="rock">
              <div>
                <img id="img" src="images/icon-rock.svg" alt="rock" />
              </div>
            </div>
            <div id="lizard">
              <div>
                <img id="img" src="images/icon-lizard.svg" alt="lizard" />
              </div>
            </div>
            <div id="spock">
              <div>
                <img id="img" src="images/icon-spock.svg" alt="spock" />
              </div>
            </div>
          </div>
          <img src="images/bg-pentagon.svg" alt="pentagon" />
        </div>
        <div class="choose">
          <div class="grad">
            <div class="my-choice">
              <div>
                <img src="images/icon-scissors.svg" alt="scissors" />
              </div>
            </div>
            <p>YOU PICKED</p>
          </div>
          <div>
            <div>
              <div class="spot">
                <div class="computer-choice">
                  <div>
                    <img src="images/icon-paper.svg" alt="paper" />
                  </div>
                </div>
              </div>
              <p>COMPUTER PICKED</p>
            </div>
          </div>
        </div>
        <div class="win">
          <h2 class="winner">YOU WIN</h2>
          <button class="play">PLAY AGAIN</button>
        </div>
      </div>
      <div class="rules"><button>RULES</button></div>

      <div class="overlay">
        <div class="game_rule">
          <div>
            <p>RULES</p>
          </div>
          <div>
            <img src="images/image-rules-bonus.svg" alt="game rule" />
          </div>
          <div class="close-modal">
            <img src="images/icon-close.svg" alt="close_modal" />
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
